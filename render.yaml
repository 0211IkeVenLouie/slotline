# Render Blueprint.
#
#   render.com -> New -> Blueprint -> pick this repository -> Apply
#
# Render's free tier allows exactly ONE Postgres database per account, so this
# blueprint does not create one. Point DATABASE_URL at a database you already
# have — the one pulseboard's blueprint created is fine — and this app keeps to
# its own schema, so nothing collides.
#
# Render will prompt for DATABASE_URL when you apply the blueprint. Paste the
# "Internal Database URL" from that database's page in the Render dashboard.
services:
  - type: web
    name: slotline
    runtime: docker        # older Render schemas call this key `env`
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false        # you supply this
      - key: DB_SCHEMA
        value: slotline
      - key: SEED_DEMO
        value: "true"
